<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Flip Phone - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #hint {
      position: fixed;
      z-index: 10;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>

  <script>
    // ฝาพับจะเปิดเมื่อพบ marker และปิดเมื่อ marker หายไป
    AFRAME.registerComponent('flip-phone', {
      init: function () {
        const marker = this.el;
        const lid = marker.querySelector('#lidPivot');

        marker.addEventListener('markerFound', () => {
          lid.setAttribute('animation__open', {
            property: 'rotation',
            to: '-105 0 0',
            dur: 1100,
            easing: 'easeOutBack'
          });
        });

        marker.addEventListener('markerLost', () => {
          lid.removeAttribute('animation__open');
          lid.setAttribute('rotation', '0 0 0');
        });
      }
    });
  </script>
</head>

<body>
  <div id="hint">ส่องกล้องไปที่ Hiro Marker 📱</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">

    <a-marker preset="hiro" flip-phone>

      <!-- โทรศัพท์ทั้งเครื่อง -->
      <a-entity position="0 0.10 0" rotation="0 0 0" scale="0.85 0.85 0.85">

        <!-- ฐานโทรศัพท์ -->
        <a-box
          position="0 0.08 0.22"
          width="1.05"
          height="0.14"
          depth="1.15"
          color="#20242B"
          material="roughness: 0.45; metalness: 0.55">
        </a-box>

        <!-- ขอบฐาน -->
        <a-box
          position="0 0.155 0.22"
          width="0.94"
          height="0.025"
          depth="1.03"
          color="#363C46">
        </a-box>

        <!-- แป้นพิมพ์ 3 x 4 -->
        <a-entity position="0 0.18 0.22">
          <!-- แถว 1 -->
          <a-box position="-0.30 0 -0.32" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0 0 -0.32" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0.30 0 -0.32" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>

          <!-- แถว 2 -->
          <a-box position="-0.30 0 -0.08" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0 0 -0.08" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0.30 0 -0.08" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>

          <!-- แถว 3 -->
          <a-box position="-0.30 0 0.16" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0 0 0.16" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0.30 0 0.16" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>

          <!-- แถว 4 -->
          <a-box position="-0.30 0 0.40" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0 0 0.40" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>
          <a-box position="0.30 0 0.40" width="0.22" height="0.035" depth="0.16" color="#D9DDE3"></a-box>

          <!-- ปุ่มโทร -->
          <a-box position="-0.30 0 -0.53" width="0.24" height="0.04" depth="0.13" color="#43A047"></a-box>
          <a-box position="0.30 0 -0.53" width="0.24" height="0.04" depth="0.13" color="#E53935"></a-box>

          <!-- ปุ่มกลาง -->
          <a-cylinder position="0 0 -0.53" radius="0.09" height="0.04" color="#AEB6C1"></a-cylinder>
        </a-entity>

        <!-- บานพับ -->
        <a-cylinder
          position="0 0.18 -0.37"
          rotation="0 0 90"
          radius="0.10"
          height="0.90"
          color="#11151B"
          material="metalness: 0.7; roughness: 0.3">
        </a-cylinder>

        <!-- จุดหมุนฝาพับ -->
        <a-entity id="lidPivot" position="0 0.18 -0.37" rotation="0 0 0">

          <!-- ฝาบน วางให้จุดหมุนอยู่ที่ขอบล่าง -->
          <a-entity position="0 0 -0.56">

            <a-box
              position="0 0 0"
              width="1.05"
              height="0.13"
              depth="1.10"
              color="#252A33"
              material="roughness: 0.38; metalness: 0.6">
            </a-box>

            <!-- หน้าจอด้านใน -->
            <a-box
              position="0 -0.071 0.02"
              width="0.78"
              height="0.018"
              depth="0.62"
              color="#55C7FF"
              material="emissive: #157AA5; emissiveIntensity: 0.7">
            </a-box>

            <!-- ลำโพง -->
            <a-box
              position="0 -0.083 -0.38"
              width="0.34"
              height="0.025"
              depth="0.055"
              color="#090B0E">
            </a-box>

            <!-- กล้องหน้า -->
            <a-sphere
              position="0.31 -0.085 -0.36"
              radius="0.035"
              color="#050505">
            </a-sphere>

          </a-entity>
        </a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
